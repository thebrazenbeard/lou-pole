name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Malformed UTF-8 is incomplete, never a clean report
        run: >-
          python -c "import subprocess,sys; p=subprocess.run([sys.executable,'-m','freerowcochkar.cli','-','--json'],input=bytes([255]),capture_output=True,timeout=5); assert p.returncode == 2 and not p.stdout and b'INCOMPLETE_UNKNOWN' in p.stderr and b'Traceback' not in p.stderr, (p.returncode,p.stdout,p.stderr)"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install --no-deps --force-reinstall dist/freerowcochkar-*.whl
      - run: freerowcochkar --help
      - run: |
          printf 'Operators must not export customer records.\nOperators may export customer records.\n' | \
            freerowcochkar --json > report.json || test "$?" -eq 1
          python -c 'import json; p=json.load(open("report.json")); assert any(f["category"] == "literal_permission_conflict" for f in p["findings"])'
